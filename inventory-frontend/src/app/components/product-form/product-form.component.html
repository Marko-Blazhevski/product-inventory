<div class="container mt-5">
  <div class="card shadow border-0">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
      <h3 class="mb-0">{{ isEditMode() ? 'Update' : 'Create New' }} Product</h3>
      <button class="btn btn-sm btn-outline-light" routerLink="/">Cancel</button>
    </div>

    <div class="card-body p-4">
      @if (message()) {
        <div class="alert alert-{{message()?.type}} shadow-sm">{{ message()?.text }}</div>
      }

      <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label fw-bold">Product Name *</label>
          <input type="text" formControlName="name" class="form-control"
                 [class.is-invalid]="productForm.get('name')?.invalid && productForm.get('name')?.touched">
          <div class="invalid-feedback">A name (min 3 chars) is required.</div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Price (€) *</label>
            <input type="number" formControlName="price" class="form-control">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Stock Quantity *</label>
            <input type="number" formControlName="quantityInStock" class="form-control">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Category</label>
          <select formControlName="category" class="form-select">
            @for (cat of categories; track cat) {
              <option [value]="cat">{{ cat }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Description</label>
          <textarea formControlName="description" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">Product Image</label>
          <input type="file" (change)="onFileSelected($event)" class="form-control" accept="image/*">
          <small class="text-muted">Uploading a new file will replace the current image.</small>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary btn-lg" [disabled]="productForm.invalid || isSubmitting">
            {{ isEditMode() ? 'Save Changes' : 'Create Product' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
